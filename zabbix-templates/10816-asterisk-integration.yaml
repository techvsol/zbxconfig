    groups:
    - name: Templates/Asterisk Integration
    items:
    - key: agent.ping
      name: Доступность агента
      tags:
      - tag: tag
        value: check
      - tag: tag
        value: ping
      trends: 31d
      uuid: e998e02857ce4ee6a1eccde71d8cd833
    - delay: 10m
      key: agent.version
      name: Версия агента (инвентаризация)
