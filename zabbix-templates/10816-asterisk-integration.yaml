      - tag: system
        value: system
      - tag: tag
        value: inv
      uuid: d1bed5b666fd4c1a8889db0ea067e708
      value_type: CHAR
    - description: 'Получение информации о контейнерах

        Array for LLD rules

        '
      key: docker.containers
      name: Контейнеры Docker
      preprocessing:
      - parameters:
        - return JSON.stringify(JSON.parse(value),['Names'])
        type: JAVASCRIPT
      - parameters:
        - "var data = JSON.parse(value)\nvar arr = new Array()\nfor (var key in data)\
          \      {\n    if (data.hasOwnProperty(key)) {\n        arr.push({ name:\
          \   data[key].Names[0].replace('/',     '') })\n    }\n}\nreturn JSON.stringify(arr)\n"
        type: JAVASCRIPT
      tags:
      - tag: component
        value: docker
      - tag: component
        value: raw
      uuid: 6e534904a9a9494fa9d2db046dddb1b9
      value_type: CHAR
    - delay: 10s
      key: docker.intagration.memory_pusage
      name: Сервис интеграции использование ОЗУ %
      params: last(//docker.intagration.memory_usage[integration])/last(//docker.intagration.memory_limit[integration])*100
      preprocessing:
      - parameters:
        - return Number(value).toFixed(2)
        type: JAVASCRIPT
      tags:
      - tag: component
        value: docker
      - tag: service
        value: intagration
      - tag: tag
        value: memory
      trends: 31d
      triggers:
      - dependencies:
        - expression: last(/Asterisk Integration/docker.intagration.memory_pusage)>=80
          name: Сервис Integration использование оперативной памяти > 80 %
        - expression: last(/Asterisk Integration/docker.intagration.memory_pusage)>=90
          name: Сервис Integration использование оперативной памяти > 90 %
        expression: last(/Asterisk Integration/docker.intagration.memory_pusage)>=70
        name: Сервис Integration использование оперативной памяти > 70 %
        priority: HIGH
        status: DISABLED
        uuid: 92b0a2cb09c94960b43c18475c118dfc
      - dependencies:
        - expression: last(/Asterisk Integration/docker.intagration.memory_pusage)>=90
          name: Сервис Integration использование оперативной памяти > 90 %
        expression: last(/Asterisk Integration/docker.intagration.memory_pusage)>=80
        name: Сервис Integration использование оперативной памяти > 80 %
        priority: AVERAGE
        status: DISABLED
        uuid: 54fbad30688f4102917c3d49b4870139
      - expression: last(/Asterisk Integration/docker.intagration.memory_pusage)>=90
        name: Сервис Integration использование оперативной памяти > 90 %
        priority: WARNING
        status: DISABLED
        uuid: 78357af930ed4f7cb48e85a4e9d0d251
      type: CALCULATED
      uuid: 107a7af3b7854400b99f27acafe336a8
      value_type: FLOAT
