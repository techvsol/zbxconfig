    description: Шаблон для мониторинга сервисов integration развернутых в Docker
    discovery_rules:
    - filter:
        conditions:
        - macro: '{#SERVICES_NAME}'
          value: integration
      graph_prototypes:
      - graph_items:
        - calc_fnc: ALL
          color: 199C0D
          item:
            host: Asterisk Integration
            key: docker.intagration.cpu_usage[{#SERVICES_NAME}]
        name: '{#SERVICES_NAME} Использование CPU сервисом интеграции'
        uuid: 4976f64f03ad43959594970815914e99
      - graph_items:
        - calc_fnc: ALL
          color: EC407A
          item:
            host: Asterisk Integration
            key: docker.intagration.memory_limit[{#SERVICES_NAME}]
        - calc_fnc: ALL
          color: 26C6DA
          item:
            host: Asterisk Integration
            key: docker.intagration.memory_usage[{#SERVICES_NAME}]
          sortorder: '1'
        name: '{#SERVICES_NAME} Использование ОЗУ сервисом интеграции'
        uuid: 5ca1aa98dbc34726b197661ac95f6b8e
      item_prototypes:
      - key: docker.container_stats[{#SERVICES_NAME}]
        name: '{#SERVICES_NAME} Данные Docker'
        tags:
        - tag: component
          value: docker
        - tag: service
          value: '{#SERVICES_NAME}'
        uuid: bb0a531f0918429a90f14bfd933cc052
        value_type: CHAR
      - key: docker.intagration.cpu_usage[{#SERVICES_NAME}]
        master_item:
          key: docker.container_stats[{#SERVICES_NAME}]
        name: '{#SERVICES_NAME} Использование CPU'
        preprocessing:
        - parameters:
          - $.cpu_stats.cpu_usage.percent_usage
          type: JSONPATH
        - parameters:
          - return Number(value).toFixed(2)
          type: JAVASCRIPT
        tags:
        - tag: component
          value: cpu
        - tag: component
          value: docker
        - tag: service
          value: '{#SERVICES_NAME}'
        trends: 31d
        trigger_prototypes:
        - expression: last(/Asterisk Integration/docker.intagration.cpu_usage[{#SERVICES_NAME}])>=75
          name: '{#SERVICES_NAME} Использование CPU > 75%'
          priority: INFO
          uuid: c9bedd801d484d7384d24fa60d471c38
        - dependencies:
          - expression: last(/Asterisk Integration/docker.intagration.cpu_usage[{#SERVICES_NAME}])>=75
            name: '{#SERVICES_NAME} Использование CPU > 75%'
          expression: last(/Asterisk Integration/docker.intagration.cpu_usage[{#SERVICES_NAME}])>=85
          name: '{#SERVICES_NAME} Использование CPU > 85%'
          priority: AVERAGE
          uuid: c4933f117f4b4f24a6ee707f12a21251
        - dependencies:
          - expression: last(/Asterisk Integration/docker.intagration.cpu_usage[{#SERVICES_NAME}])>=75
            name: '{#SERVICES_NAME} Использование CPU > 75%'
          - expression: last(/Asterisk Integration/docker.intagration.cpu_usage[{#SERVICES_NAME}])>=85
            name: '{#SERVICES_NAME} Использование CPU > 85%'
          expression: last(/Asterisk Integration/docker.intagration.cpu_usage[{#SERVICES_NAME}])>=90
          name: '{#SERVICES_NAME} Использование CPU > 90%'
          priority: HIGH
          uuid: 4974c4f65be24684bd2f978a18afb82c
        type: DEPENDENT
        uuid: f6564495d1c04312b30f0011bdff28d2
      - key: docker.intagration.memory_limit[{#SERVICES_NAME}]
        master_item:
          key: docker.container_stats[{#SERVICES_NAME}]
        name: '{#SERVICES_NAME} Лимит оперативной памяти'
        preprocessing:
        - parameters:
          - $.memory_stats.limit
          type: JSONPATH
        tags:
        - tag: component
          value: docker
        - tag: component
          value: memory
        - tag: service
          value: '{#SERVICES_NAME}'
        trends: 31d
        type: DEPENDENT
        units: B
        uuid: 7a4ece5b7a3b4ab3a26f3b6ea3a9a138
      - key: docker.intagration.memory_usage[{#SERVICES_NAME}]
        master_item:
          key: docker.container_stats[{#SERVICES_NAME}]
        name: '{#SERVICES_NAME} Использование оперативной памяти'
        preprocessing:
        - parameters:
          - $.memory_stats.usage
          type: JSONPATH
        tags:
        - tag: component
          value: docker
        - tag: component
          value: memory
        - tag: service
          value: '{#SERVICES_NAME}'
        trends: 31d
        type: DEPENDENT
        units: B
        uuid: 25029fe1db594732b28f2f9120a30d60
      key: integration.services
      lld_macro_paths:
      - lld_macro: '{#SERVICES_NAME}'
